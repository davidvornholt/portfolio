name: Publish container

# The infrastructure promotion proof binds push runs by workflow path and id.
# A squash commit on main is new, so wait for Standards to pass on that exact
# commit before building instead of relying on the pull request's checks.
# Labeled pull requests use the same workflow id, but produce only a bounded
# credential-free artifact for the trusted preview follow-up.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - edited
  push:
    branches:
      - main

permissions: {}

# Grouping per branch rather than per commit: the tracked tag is a promotion
# source, so two pushes must not race to move it. Queued rather than cancelled,
# because a cancelled run can already have pushed the image without announcing
# it. GitHub keeps only the newest pending run, so a burst still settles on the
# newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  container-smoke:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.state == 'open' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'pr-preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'pr-preview')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout the pull request head
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require the exact pull request head before build
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Set up Bun for the exact-head gate
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install just for the exact-head gate
        uses: extractions/setup-just@v4
        with:
          just-version: "1.57.0"

      - name: Install exact-head dependencies
        run: bun install --frozen-lockfile

      - name: Install exact-head Playwright Chromium
        run: |
          set -euo pipefail
          playwright=$(find . -path '*/node_modules/.bin/playwright' -print -quit)
          test -n "$playwright"
          "$playwright" install --with-deps chromium

      - name: Run the full exact-head repository gate
        id: exact_head_gate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STANDARDS_SKIP_GITHUB_CHECK: "true"
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          bun run check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the runtime image without credentials
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: portfolio:pull-request
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.personal-infra.portfolio-preview=true

      - name: Verify the container health without app credentials
        run: |
          set -euo pipefail
          container=portfolio-pull-request-smoke
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --rm --name "$container" --network host \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            portfolio:pull-request

          response="$RUNNER_TEMP/portfolio-preview-response"
          for _ in $(seq 1 40); do
            if curl --fail --silent --show-error \
              --output "$response" http://127.0.0.1:3000/; then
              break
            fi
            sleep 0.25
          done
          test -s "$response"
          test "$(docker inspect "$container" --format '{{.Config.User}}')" = app

      - name: Package the eligible exact-head preview artifact
        id: preview
        env:
          EXACT_HEAD_GATE_OUTCOME: ${{ steps.exact_head_gate.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$PR_NUMBER" =~ ^[1-9][0-9]{0,5}$ ]]
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ && "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$REPOSITORY" = davidvornholt/portfolio
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$EXACT_HEAD_GATE_OUTCOME" = success

          revision=$(docker image inspect portfolio:pull-request \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          source=$(docker image inspect portfolio:pull-request \
            --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')
          preview_owner=$(docker image inspect portfolio:pull-request \
            --format '{{ index .Config.Labels "io.personal-infra.portfolio-preview" }}')
          test "$revision" = "$HEAD_SHA"
          test "$source" = "https://github.com/$REPOSITORY"
          test "$preview_owner" = true
          image_size=$(docker image inspect portfolio:pull-request --format '{{.Size}}')
          [[ "$image_size" =~ ^[1-9][0-9]*$ ]]
          test "$image_size" -le 2147483648

          artifact_root="$RUNNER_TEMP/portfolio-pr-preview"
          mkdir -p "$artifact_root"
          docker image save portfolio:pull-request | gzip -6 >"$artifact_root/portfolio-image.tar.gz"
          archive_size=$(stat --format '%s' "$artifact_root/portfolio-image.tar.gz")
          test "$archive_size" -gt 0
          test "$archive_size" -le 1610612736
          gzip --test "$artifact_root/portfolio-image.tar.gz"
          jq -nS \
            --arg archive portfolio-image.tar.gz \
            --arg headSha "$HEAD_SHA" \
            --arg imageRepository ghcr.io/davidvornholt/portfolio \
            --arg imageTag portfolio:pull-request \
            --arg job container-smoke \
            --arg path .github/workflows/publish-container.yml \
            --arg repository "$REPOSITORY" \
            --argjson pullRequest "$PR_NUMBER" \
            --argjson runAttempt "$RUN_ATTEMPT" \
            --argjson runId "$RUN_ID" \
            --argjson version 1 \
            --argjson workflowId 316903523 \
            '{
              version: $version,
              repository: $repository,
              pullRequest: $pullRequest,
              headSha: $headSha,
              workflow: {
                id: $workflowId,
                path: $path,
                runId: $runId,
                runAttempt: $runAttempt,
                job: $job
              },
              image: {
                repository: $imageRepository,
                archive: $archive,
                tag: $imageTag
              }
            }' >"$artifact_root/metadata.json"

      - name: Upload the immutable preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-pr-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/portfolio-pr-preview/metadata.json
            ${{ runner.temp }}/portfolio-pr-preview/portfolio-image.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          overwrite: false


  # Fail-closed by construction: every path that is not an observed successful
  # `check` job for this exact commit — no run, an unfinished run, a run that
  # ended any other way, a missing job, an expired deadline — exits non-zero.
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      gated-sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Require the standards gate for this exact commit
        id: gate
        env:
          GATE_JOB: check
          GATE_WORKFLOW: standards.yml
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$(($(date -u +%s) + 2400))
          while :; do
            # Newest first, so a re-run decides. A green run that was later
            # re-run into a failure must not keep publishing.
            run=$(gh api \
              "repos/$REPOSITORY/actions/workflows/$GATE_WORKFLOW/runs?head_sha=$SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] // empty')
            if [ -n "$run" ] && [ "$(jq -er .status <<<"$run")" = completed ]; then
              break
            fi
            if [ "$(date -u +%s)" -ge "$deadline" ]; then
              echo "::error::The $GATE_WORKFLOW gate did not complete for $SHA within the deadline"
              exit 1
            fi
            sleep 20
          done

          test "$(jq -er .head_sha <<<"$run")" = "$SHA"
          conclusion=$(jq -er .conclusion <<<"$run")
          if [ "$conclusion" != success ]; then
            echo "::error::The $GATE_WORKFLOW gate concluded $conclusion for $SHA"
            exit 1
          fi

          # The run conclusion alone would also be satisfied by a `check` job
          # that never ran, so the required job is asserted by name.
          run_id=$(jq -er .id <<<"$run")
          job=$(gh api --paginate "repos/$REPOSITORY/actions/runs/$run_id/jobs" \
            --jq ".jobs[] | select(.name == \"$GATE_JOB\") | .conclusion")
          if [ "$job" != success ]; then
            echo "::error::The $GATE_JOB job of run $run_id concluded ${job:-nothing} for $SHA"
            exit 1
          fi

          echo "::notice::$GATE_WORKFLOW run $run_id gated $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    # The gate proves a commit passed; this proves it was this one.
    if: needs.gate.outputs.gated-sha == github.sha
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout the commit being published
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish the tracked tag
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          # Plain manifest, not an attestation index: prod-1 pins and pulls the
          # digest this step reports, and podman resolves it directly.
          provenance: false
          tags: ghcr.io/davidvornholt/portfolio:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Emit immutable promotion record
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/davidvornholt/portfolio
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          record=$(jq -cn --arg repository "$REPOSITORY" --arg ref "$REF" --arg sha "$SHA" --arg runId "$RUN_ID" --arg image "$IMAGE" --arg digest "$DIGEST" '{repository:$repository,ref:$ref,sha:$sha,runId:$runId,image:$image,digest:$digest}')
          marker_left=IMAGE_PROMOTION
          marker_right=_RECORD
          printf '%s %s\n' "${marker_left}${marker_right}" "$record"

  announce:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the canonical SOPS action
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve the broker app id
        uses: ./.github/actions/sops-secret
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          secret-file: secrets/ci.yaml
          secret-key: broker_app.app_id
          env-name: BROKER_APP_ID

      - name: Resolve the broker private key
        uses: ./.github/actions/sops-secret
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          secret-file: secrets/ci.yaml
          secret-key: broker_app.private_key
          env-name: BROKER_APP_PRIVATE_KEY

      - name: Mint an infrastructure announcement token
        id: broker
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.BROKER_APP_ID }}
          private-key: ${{ env.BROKER_APP_PRIVATE_KEY }}
          owner: davidvornholt
          repositories: personal-infra
          permission-contents: write

      - name: Announce image digest
        env:
          BUILD_DIGEST: ${{ needs.build.outputs.digest }}
          GH_TOKEN: ${{ steps.broker.outputs.token }}
          IMAGE_REPOSITORY: ghcr.io/davidvornholt/portfolio
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$SOURCE_REPOSITORY" = davidvornholt/portfolio
          test "$SOURCE_REF" = refs/heads/main
          test "$IMAGE_REPOSITORY" = ghcr.io/davidvornholt/portfolio
          gh api repos/davidvornholt/personal-infra/dispatches \
            -f event_type=image-bump \
            -f "client_payload[app]=portfolio" \
            -f "client_payload[source_repository]=$SOURCE_REPOSITORY" \
            -f "client_payload[source_ref]=$SOURCE_REF" \
            -f "client_payload[source_sha]=$SOURCE_SHA" \
            -f "client_payload[source_run_id]=$SOURCE_RUN_ID" \
            -f "client_payload[image_repository]=$IMAGE_REPOSITORY" \
            -f "client_payload[digest]=$BUILD_DIGEST"
