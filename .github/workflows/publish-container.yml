name: Publish container

# Labeled pull requests produce only a bounded credential-free artifact for the
# trusted preview follow-up, which binds runs by workflow path and id. A push
# to main builds the commit image while Standards runs, then releases that
# exact digest once Standards has passed on the exact squash commit, instead
# of relying on the pull request's checks. Once a day the schedule starts this
# workflow again on main as a `workflow_dispatch`, which rebuilds and releases
# the newest commit of main the same way, with the day's data. The scheduled
# run itself builds nothing: the production host accepts a release only from a
# `push` or a `workflow_dispatch`.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - edited
  push:
    branches:
      - main
  # Once a day, so the chart of merged changes and its "updated" date stay
  # current without anyone touching the site.
  schedule:
    - cron: "17 4 * * *"
  # What the schedule starts, and a publish by hand. Only a dispatch on main
  # builds or releases.
  workflow_dispatch:

permissions: {}

jobs:
  container-smoke:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.state == 'open' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'pr-preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'pr-preview')
    concurrency:
      group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout the pull request head
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require the exact pull request head before build
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Set up Bun for the exact-head gate
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install just for the exact-head gate
        uses: extractions/setup-just@v4
        with:
          just-version: "1.57.0"

      - name: Install exact-head dependencies
        run: bun install --frozen-lockfile

      - name: Install exact-head Playwright Chromium
        run: |
          set -euo pipefail
          playwright=$(find . -path '*/node_modules/.bin/playwright' -print -quit)
          test -n "$playwright"
          "$playwright" install --with-deps chromium

      - name: Run the full exact-head repository gate
        id: exact_head_gate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STANDARDS_SKIP_GITHUB_CHECK: "true"
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          bun run check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Write the build line of the preview
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg sha "$HEAD_SHA" \
            --arg title "$(git log -1 --format=%s)" \
            --arg committedOn "$(TZ=Europe/Berlin git log -1 --format=%cd --date=format-local:%Y-%m-%d)" \
            '{commit: {sha: $sha, title: $title, committedOn: $committedOn, released: false}}' \
            >apps/web/src/shared/build-info/data/build-info.json

      - name: Build the runtime image without credentials
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: portfolio:pull-request
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.personal-infra.portfolio-preview=true
          cache-from: type=registry,ref=ghcr.io/davidvornholt/portfolio:buildcache

      - name: Verify the container health without app credentials
        run: |
          set -euo pipefail
          container=portfolio-pull-request-smoke
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --rm --name "$container" --network host \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            portfolio:pull-request

          response="$RUNNER_TEMP/portfolio-preview-response"
          for _ in $(seq 1 40); do
            if curl --fail --silent --show-error \
              --output "$response" http://127.0.0.1:3000/; then
              break
            fi
            sleep 0.25
          done
          test -s "$response"
          test "$(docker inspect "$container" --format '{{.Config.User}}')" = app

      - name: Package the eligible exact-head preview artifact
        id: preview
        env:
          EXACT_HEAD_GATE_OUTCOME: ${{ steps.exact_head_gate.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$PR_NUMBER" =~ ^[1-9][0-9]{0,5}$ ]]
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ && "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$REPOSITORY" = davidvornholt/portfolio
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$EXACT_HEAD_GATE_OUTCOME" = success

          revision=$(docker image inspect portfolio:pull-request \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          source=$(docker image inspect portfolio:pull-request \
            --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')
          preview_owner=$(docker image inspect portfolio:pull-request \
            --format '{{ index .Config.Labels "io.personal-infra.portfolio-preview" }}')
          test "$revision" = "$HEAD_SHA"
          test "$source" = "https://github.com/$REPOSITORY"
          test "$preview_owner" = true
          image_size=$(docker image inspect portfolio:pull-request --format '{{.Size}}')
          [[ "$image_size" =~ ^[1-9][0-9]*$ ]]
          test "$image_size" -le 2147483648

          artifact_root="$RUNNER_TEMP/portfolio-pr-preview"
          mkdir -p "$artifact_root"
          docker image save portfolio:pull-request | gzip -6 >"$artifact_root/portfolio-image.tar.gz"
          archive_size=$(stat --format '%s' "$artifact_root/portfolio-image.tar.gz")
          test "$archive_size" -gt 0
          test "$archive_size" -le 1610612736
          gzip --test "$artifact_root/portfolio-image.tar.gz"
          jq -nS \
            --arg archive portfolio-image.tar.gz \
            --arg headSha "$HEAD_SHA" \
            --arg imageRepository ghcr.io/davidvornholt/portfolio \
            --arg imageTag portfolio:pull-request \
            --arg job container-smoke \
            --arg path .github/workflows/publish-container.yml \
            --arg repository "$REPOSITORY" \
            --argjson pullRequest "$PR_NUMBER" \
            --argjson runAttempt "$RUN_ATTEMPT" \
            --argjson runId "$RUN_ID" \
            --argjson version 1 \
            --argjson workflowId 316903523 \
            '{
              version: $version,
              repository: $repository,
              pullRequest: $pullRequest,
              headSha: $headSha,
              workflow: {
                id: $workflowId,
                path: $path,
                runId: $runId,
                runAttempt: $runAttempt,
                job: $job
              },
              image: {
                repository: $imageRepository,
                archive: $archive,
                tag: $imageTag
              }
            }' >"$artifact_root/metadata.json"

      - name: Upload the immutable preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-pr-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/portfolio-pr-preview/metadata.json
            ${{ runner.temp }}/portfolio-pr-preview/portfolio-image.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          overwrite: false

  # The scheduled run is only this job. It holds no secret, and its token can
  # write nothing but Actions. A dispatch is one of the two events through
  # which a workflow's own token can start a run.
  daily-dispatch:
    if: >-
      github.event_name == 'schedule' &&
      github.repository == 'davidvornholt/portfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the daily publish on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh workflow run publish-container.yml --repo "$REPOSITORY" --ref main

  # Fail-closed by construction: every path that is not an observed successful
  # `check` job for this exact commit — no run, an unfinished run, a run that
  # ended any other way, a missing job, an expired deadline — exits non-zero.
  gate:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'davidvornholt/portfolio' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      gated-sha: ${{ steps.gate.outputs.sha }}
    steps:
      # An `if` compares strings without regard to case, so the conditions of
      # the gate, the build and the release also hold on a branch named
      # `Main`. Each of the three starts with this step, which compares
      # exactly, before it polls, checks out or reads a secret.
      - name: Require the main branch exactly
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Require the standards gate for this exact commit
        id: gate
        env:
          GATE_JOB: check
          GATE_WORKFLOW: standards.yml
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$(($(date -u +%s) + 2400))
          while :; do
            # Newest first, so a re-run decides. A green run that was later
            # re-run into a failure must not keep publishing. The daily
            # publish runs on the newest commit of main and asks for the same
            # run: the one the push of that commit started.
            run=$(gh api \
              "repos/$REPOSITORY/actions/workflows/$GATE_WORKFLOW/runs?head_sha=$SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] // empty')
            if [ -n "$run" ] && [ "$(jq -er .status <<<"$run")" = completed ]; then
              break
            fi
            if [ "$(date -u +%s)" -ge "$deadline" ]; then
              echo "::error::The $GATE_WORKFLOW gate did not complete for $SHA within the deadline"
              exit 1
            fi
            sleep 20
          done

          test "$(jq -er .head_sha <<<"$run")" = "$SHA"
          conclusion=$(jq -er .conclusion <<<"$run")
          if [ "$conclusion" != success ]; then
            echo "::error::The $GATE_WORKFLOW gate concluded $conclusion for $SHA"
            exit 1
          fi

          # The run conclusion alone would also be satisfied by a `check` job
          # that never ran, so the required job is asserted by name.
          run_id=$(jq -er .id <<<"$run")
          job=$(gh api --paginate "repos/$REPOSITORY/actions/runs/$run_id/jobs" \
            --jq ".jobs[] | select(.name == \"$GATE_JOB\") | .conclusion")
          if [ "$job" != success ]; then
            echo "::error::The $GATE_JOB job of run $run_id concluded ${job:-nothing} for $SHA"
            exit 1
          fi

          echo "::notice::$GATE_WORKFLOW run $run_id gated $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'davidvornholt/portfolio' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Require the main branch exactly
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Checkout the commit being published
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The App that reads the merged changes can write nothing and can't read
      # code. Its credentials are resolved before any dependency is installed
      # and reach only the steps that mint tokens from them.
      - name: Resolve the client ID of the App that reads the changes
        id: changes-app-client-id
        uses: ./.github/actions/sops-secret
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          secret-file: secrets/ci.yaml
          secret-key: changes_app.client_id

      - name: Resolve the private key of the App that reads the changes
        id: changes-app-private-key
        uses: ./.github/actions/sops-secret
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          secret-file: secrets/ci.yaml
          secret-key: changes_app.private_key

      # One token per owner the App is installed on, each good for an hour.
      # These owners and CHANGES_OWNERS below are one list: to add or remove
      # an owner, change both and install or remove the App there.
      - name: Mint the token that reads davidvornholt
        id: changes-token-davidvornholt
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ steps.changes-app-client-id.outputs.value }}
          private-key: ${{ steps.changes-app-private-key.outputs.value }}
          owner: davidvornholt
          permission-actions: read
          permission-checks: read
          permission-metadata: read
          permission-pull-requests: read
          permission-statuses: read

      - name: Mint the token that reads prosabridge
        id: changes-token-prosabridge
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ steps.changes-app-client-id.outputs.value }}
          private-key: ${{ steps.changes-app-private-key.outputs.value }}
          owner: prosabridge
          permission-actions: read
          permission-checks: read
          permission-metadata: read
          permission-pull-requests: read
          permission-statuses: read

      - name: Mint the token that reads atrium-schule
        id: changes-token-atrium-schule
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ steps.changes-app-client-id.outputs.value }}
          private-key: ${{ steps.changes-app-private-key.outputs.value }}
          owner: atrium-schule
          permission-actions: read
          permission-checks: read
          permission-metadata: read
          permission-pull-requests: read
          permission-statuses: read

      - name: Mint the token that reads fes-kirchheim
        id: changes-token-fes-kirchheim
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ steps.changes-app-client-id.outputs.value }}
          private-key: ${{ steps.changes-app-private-key.outputs.value }}
          owner: fes-kirchheim
          permission-actions: read
          permission-checks: read
          permission-metadata: read
          permission-pull-requests: read
          permission-statuses: read

      - name: Mint the token that reads cg-bibi
        id: changes-token-cg-bibi
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ steps.changes-app-client-id.outputs.value }}
          private-key: ${{ steps.changes-app-private-key.outputs.value }}
          owner: cg-bibi
          permission-actions: read
          permission-checks: read
          permission-metadata: read
          permission-pull-requests: read
          permission-statuses: read

      - name: Set up Bun for the data fetch
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install the dependencies of the data fetch
        run: bun install --frozen-lockfile

      # Fail closed: when the fetch fails, nothing is built or released, and
      # the live site keeps the chart it has. The image never ships the
      # snapshot that is checked in, which only serves previews and tests.
      - name: Fetch the day's merged changes
        env:
          CHANGES_GITHUB_TOKENS: >-
            ${{ steps.changes-token-davidvornholt.outputs.token }},
            ${{ steps.changes-token-prosabridge.outputs.token }},
            ${{ steps.changes-token-atrium-schule.outputs.token }},
            ${{ steps.changes-token-fes-kirchheim.outputs.token }},
            ${{ steps.changes-token-cg-bibi.outputs.token }}
          CHANGES_OWNERS: davidvornholt,prosabridge,atrium-schule,fes-kirchheim,cg-bibi
          CHANGES_SITE_VERDICTS: read
        run: bun run --cwd apps/web changes:fetch

      - name: Write the build line of the release
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg sha "$SHA" \
            --arg title "$(git log -1 --format=%s)" \
            --arg committedOn "$(TZ=Europe/Berlin git log -1 --format=%cd --date=format-local:%Y-%m-%d)" \
            '{commit: {sha: $sha, title: $title, committedOn: $committedOn, released: true}}' \
            >apps/web/src/shared/build-info/data/build-info.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Only the build a push starts writes the layer cache, to a GHCR tag
      # rather than the shared Actions cache quota. The daily build and the
      # pull request build read it but never write it. Nothing deploys the
      # cache tag; the host pulls the released digest.
      - name: Build and publish the commit image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Plain manifest, not an attestation index: prod-1 pulls the digest
          # this step reports, and podman resolves it directly.
          provenance: false
          tags: ghcr.io/davidvornholt/portfolio:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=ghcr.io/davidvornholt/portfolio:buildcache
          cache-to: ${{ github.event_name == 'push' && 'type=registry,ref=ghcr.io/davidvornholt/portfolio:buildcache,mode=max,image-manifest=true,oci-mediatypes=true' || '' }}

  # The host releases only an image whose revision label is the commit in the
  # job's OIDC token, and it ignores a release from an older run than the one
  # it serves. Releases and Roll back share one FIFO queue per unit.
  release:
    needs:
      - gate
      - build
    # The gate proves a commit passed; this proves it was this one.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'davidvornholt/portfolio' &&
      github.ref == 'refs/heads/main' &&
      needs.gate.outputs.gated-sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    concurrency:
      group: app-release-portfolio
      cancel-in-progress: false
      queue: max
    steps:
      - name: Require the main branch exactly
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Checkout the commit being released
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Release the gated image to production
        id: release
        uses: ./.github/actions/app-release
        with:
          unit: portfolio
          host: prod-1.vornholt.online
          known-host: prod-1.vornholt.online ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFkom7Y24gnBa9X+gUDBZvlCnXiuKTo87ROOtlMpgNH5
          images: portfolio@${{ needs.build.outputs.digest }}
          age-key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Log in to the GitHub Container Registry
        if: steps.release.outputs.result == 'released' || steps.release.outputs.result == 'unchanged'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # A superseded run leaves main on the newer release that superseded it.
      - name: Point the main tag at the released image
        if: steps.release.outputs.result == 'released' || steps.release.outputs.result == 'unchanged'
        env:
          APPS_JSON: ${{ steps.release.outputs.apps-json }}
          BUILD_DIGEST: ${{ needs.build.outputs.digest }}
          IMAGE: ghcr.io/davidvornholt/portfolio
        run: |
          set -euo pipefail
          [[ "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(jq -er .portfolio.digest <<<"$APPS_JSON")" = "$BUILD_DIGEST"
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:main" "$IMAGE@$BUILD_DIGEST"
          resolved=$(docker buildx imagetools inspect "$IMAGE:main" --format '{{json .Manifest}}' | jq -er .digest)
          test "$resolved" = "$BUILD_DIGEST"
