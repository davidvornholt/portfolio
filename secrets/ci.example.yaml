# Plaintext shape only. Do not put real CI secrets in this file.
# Mirror this shape in the encrypted secrets/ci.yaml (SOPS + age), decrypted in
# CI with the SOPS_AGE_KEY GitHub Actions secret. This file is seeded once and
# then owned by your repo — extend it to match your real secrets; sync will not
# overwrite it.
ci:
  # Full ntfy topic URL the `Notify pause` workflow pushes to when an agent
  # review cycle pauses on a question. The topic name is the only access
  # control, so make it random and unguessable.
  ntfy_topic_url: https://ntfy.sh/replace-with-a-random-unguessable-topic
  # Broker GitHub App credentials. `Standards sync` mints a short-lived
  # current-repository installation token from them with Contents read and
  # Pull requests write.
  # Missing credentials or failed minting stop the workflow without a PAT or
  # workflow-token fallback.
  # Provision this nested shape with:
  # bun standards creds add github --dest ci:ci.broker_app
  broker_app:
    app_id: replace-with-the-broker-github-app-id
    client_id: replace-with-the-broker-github-app-client-id
    private_key: |-
      -----BEGIN RSA PRIVATE KEY-----
      replace-with-the-broker-github-app-private-key
      -----END RSA PRIVATE KEY-----
  # The GitHub App `vornholt-changes-reader`, from which `Publish container`
  # mints the tokens that read the merged changes for the home page's chart.
  # It has read access to Metadata, Pull requests, Checks, Commit statuses and
  # Actions, no write access and no access to code. It is public only so that
  # it can be installed on more than one owner, and it is installed, with all
  # repositories, on every owner the workflow mints a token for.
  # To replace the key, create a new one on the App's settings page, store it
  # here, check that the workflow still mints tokens, then delete the old one.
  # A missing or revoked key fails the run before anything is built, and the
  # live site keeps its last good version.
  changes_app:
    app_id: replace-with-the-changes-app-id
    client_id: replace-with-the-changes-app-client-id
    private_key: |-
      -----BEGIN RSA PRIVATE KEY-----
      replace-with-the-changes-app-private-key
      -----END RSA PRIVATE KEY-----
  # SSH key that Publish container and Roll back use to reach the portfolio
  # app-release unit on prod-1.vornholt.online. The host accepts it only with
  # a GitHub OIDC token from main of this repository.
  app_release:
    ssh_private_key: |
      -----BEGIN OPENSSH PRIVATE KEY-----
      replace-with-the-app-release-ssh-private-key
      -----END OPENSSH PRIVATE KEY-----
